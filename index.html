<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<meta name="theme-color" content="#1f1612">
<meta property="og:type" content="restaurant">
<meta property="og:title" content="Los Jalapeños Mexican Restaurant">
<meta property="og:description" content="Authentic Mexican food made fresh every day in Unicoi and Piney Flats, Tennessee.">
<meta property="og:image" content="/assets/dining-room.webp">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bitter:ital,wght@0,500;0,700;0,800;1,500;1,600&amp;family=Instrument+Sans:wght@400;500;600;700&amp;display=swap">
<link rel="stylesheet" href="/styles.css">
<script type="application/ld+json">{"@context": "https://schema.org", "@graph": [{"@type": "Restaurant", "name": "Los Jalapeños Mexican Restaurant", "servesCuisine": "Mexican", "url": "https://losjalapenosmexrest.com/", "email": "info@losjalapenosmexrest.com", "telephone": "+1-423-743-3512", "priceRange": "$", "address": {"@type": "PostalAddress", "streetAddress": "100 Rocky Bottom Dr, Suite 1", "addressLocality": "Unicoi", "addressRegion": "TN", "postalCode": "37692", "addressCountry": "US"}}, {"@type": "Restaurant", "name": "Los Jalapeños Mexican Restaurant – Piney Flats", "servesCuisine": "Mexican", "url": "https://losjalapenosmexrest.com/", "telephone": "+1-423-291-0425", "priceRange": "$", "address": {"@type": "PostalAddress", "streetAddress": "6681 Bristol Hwy, Suite 70", "addressLocality": "Piney Flats", "addressRegion": "TN", "postalCode": "37686", "addressCountry": "US"}}]}</script>
</head>
<body>
<div id="root"></div>
<noscript><p style="padding:24px;font-family:sans-serif">Los Jalapeños Mexican Restaurant. Unicoi: 100 Rocky Bottom Dr, Suite 1, (423) 743-3512. Piney Flats: 6681 Bristol Hwy, Suite 70, (423) 291-0425. Please turn on JavaScript to see the menu.</p></noscript>
<template id="tpl">
<div id="top" style="font-family: 'Instrument Sans', system-ui, sans-serif; font-size: 17px; line-height: 27px; color: #2b1d17; background: #fbf6ec; min-height: 100vh">

<div style="background: #1f1612; color: #fbf6ec; font-size: 14px; line-height: 20px">
<div style="max-width: 1240px; margin: 0 auto; padding: 6px clamp(20px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 4px 24px">
<div style="display: flex; flex-wrap: wrap; align-items: center; gap: 4px 24px">
<a class="hideSm" href="{{loc.maps}}" style="display: flex; align-items: center; gap: 6px; color: #fbf6ec; min-height: 36px; text-decoration: none"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8a317" stroke-width="2" stroke-linecap="round"><path d="M12 22s7-6.5 7-12a7 7 0 0 0-14 0c0 5.5 7 12 7 12z"></path><circle cx="12" cy="10" r="2.5"></circle></svg>{{t.util.directions}}</a>
<span class="hideSm" style="display: flex; align-items: center; gap: 6px"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#e8a317" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg>{{t.util.lunch}}</span>
</div>
<div role="group" aria-label="{{t.chooseLoc}}" style="display: flex; align-items: center; gap: 4px; margin-left: auto"><span style="font-size: 13px; margin-right: 6px">{{t.yourLocShort}}:</span>
<sc-for list="{{locBtns}}" as="lb" hint-placeholder-count="2">
<sc-if value="{{lb.active}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" onClick="{{lb.pick}}" style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: none; background: #e8a317; color: #1f1612; font: 700 13px 'Instrument Sans', sans-serif; cursor: pointer">{{lb.name}}</button>
</sc-if>
<sc-if value="{{lb.inactive}}" hint-placeholder-val="{{true}}">
<button type="button" aria-pressed="false" onClick="{{lb.pick}}" style="min-height: 32px; padding: 0 12px; border-radius: 999px; border: none; background: transparent; color: #fbf6ec; font: 500 13px 'Instrument Sans', sans-serif; cursor: pointer; text-decoration: underline; text-underline-offset: 3px">{{lb.name}}</button>
</sc-if>
</sc-for>
</div>
</div>
</div>

<header style="position: sticky; top: 0; z-index: 20; background: #fbf6ec; border-bottom: 1px solid #e4d6bf">
<div style="max-width: 1240px; margin: 0 auto; padding: 10px clamp(20px, 4vw, 40px); display: grid; grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr); align-items: center; gap: 16px" class="hdr">
<nav aria-label="Main" class="topnav" style="gap: 28px; font-weight: 600; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase">
<a class="navlink" href="#menu" style="text-decoration: none; color: #2b1d17; padding: 12px 0">{{t.nav.menu}}</a>
<a class="navlink" href="#specials" style="text-decoration: none; color: #2b1d17; padding: 12px 0">{{t.nav.specials}}</a>
<a class="navlink" href="#locations" style="text-decoration: none; color: #2b1d17; padding: 12px 0">{{t.nav.locations}}</a>
</nav>
<a class="logo" href="#top" aria-label="Los Jalapeños home" style="grid-column: 2; display: flex; flex-direction: column; align-items: center; text-decoration: none; line-height: 1">
<span style="display: flex; align-items: center; gap: 2px; font-family: 'Bitter', Georgia, serif; font-weight: 800; font-size: 30px"><span style="color: #c3313d">Los</span><svg aria-hidden="true" width="44" height="26" viewBox="0 0 64 36"><path d="M58 14C61 24 53 33 41 34C29 35 15 32 5 28C2 27 2 25 4.5 24.5C12 22 18 16 26 12C36 7 54 6 58 14Z" fill="#c3313d" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path><path d="M27 13C31 9 38 7 44 7C50 6 56 6 60 9C62.5 12 62 17 59.5 20.5C57 18 54.5 16 51 17C47.5 14.5 43 16.5 39 14.5C35 16 31 14.5 27 13Z" fill="#2d8155" stroke="#FFFFFF" stroke-width="1.6" stroke-linejoin="round"></path><path d="M53 8C54 5 55.5 3 58 1.5" fill="none" stroke="#2d8155" stroke-width="3" stroke-linecap="round"></path></svg><span style="color: #1f6a40">Jalapeños</span></span>
<span style="display: flex; align-items: center; gap: 8px; margin-top: 4px; font-size: 11px; font-weight: 700; letter-spacing: 0.22em; color: #2b1d17"><span aria-hidden="true" style="width: 18px; height: 1.5px; background: #c3313d"></span>{{t.logoSub}}<span aria-hidden="true" style="width: 18px; height: 1.5px; background: #c3313d"></span></span>
</a>
<div class="acts" style="grid-column: 3; display: flex; align-items: center; justify-content: flex-end; gap: 12px">
<button type="button" onClick="{{toggleLang}}" aria-label="{{t.langAria}}" style="min-height: 44px; padding: 0 6px; border: none; background: transparent; color: #2b1d17; font: 600 14px 'Instrument Sans', sans-serif; letter-spacing: 0.08em; text-transform: uppercase; cursor: pointer">{{t.langBtn}}</button>
<a class="hideSm" href="{{loc.tel}}" style="min-height: 44px; padding: 0 18px; border: 1.5px solid #1f6a40; border-radius: 4px; color: #1f6a40; text-decoration: none; font-weight: 700; font-size: 14px; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center; box-sizing: border-box">{{t.callLoc}} {{loc.name}}</a>
</div>
</div>
</header>

<section aria-labelledby="hero-title" style="position: relative; background: #1f1612; color: #fbf6ec; overflow: hidden">
<img src="/assets/dining-room.webp" alt="" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center 35%">
<div aria-hidden="true" style="position: absolute; inset: 0; background: linear-gradient(90deg, rgba(31, 22, 18, 0.92) 0%, rgba(31, 22, 18, 0.78) 42%, rgba(31, 22, 18, 0.2) 80%)"></div>
<div style="position: relative; max-width: 1240px; margin: 0 auto; padding: clamp(72px, 11vw, 150px) clamp(20px, 4vw, 40px) clamp(110px, 13vw, 180px); display: flex; flex-direction: column; gap: 22px">
<div aria-hidden="true" style="display: flex; gap: 6px"><span style="width: 56px; height: 4px; border-radius: 2px; background: #2d8155"></span><span style="width: 56px; height: 4px; border-radius: 2px; background: #fbf6ec"></span><span style="width: 56px; height: 4px; border-radius: 2px; background: #c3313d"></span></div>
<h1 id="hero-title" style="margin: 0; font-family: 'Bitter', Georgia, serif; font-weight: 800; font-size: clamp(42px, 6vw, 76px); line-height: 1.05; max-width: 15ch">{{t.heroA}} <span style="color: #e8a317">{{t.heroAccent}}</span> {{t.heroB}}</h1>
<p style="margin: 0; font-family: 'Bitter', Georgia, serif; font-style: italic; font-weight: 500; font-size: clamp(19px, 2vw, 24px); line-height: 1.4; max-width: 34ch">{{t.heroItalic}}</p>
<div style="display: flex; flex-wrap: wrap; gap: 14px; padding-top: 8px">
<a class="gold" href="#menu" style="min-height: 58px; padding: 0 30px; border-radius: 4px; background: #e8a317; color: #1f1612; text-decoration: none; font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 19px; display: flex; align-items: center; gap: 10px">{{t.viewMenu}} <span aria-hidden="true">→</span></a>
<a href="{{loc.tel}}" style="min-height: 58px; padding: 0 26px; border-radius: 4px; border: 1.5px solid #fbf6ec; color: #fbf6ec; text-decoration: none; font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 19px; display: flex; align-items: center; box-sizing: border-box">{{loc.phone}}</a>
</div>
</div>
<svg aria-hidden="true" viewBox="0 0 1440 70" preserveAspectRatio="none" width="100%" height="56" style="position: absolute; left: 0; bottom: -1px; display: block"><path d="M0 38 C 180 70 360 8 560 30 C 760 52 900 12 1100 28 C 1260 40 1360 22 1440 30 L 1440 70 L 0 70 Z" fill="#fbf6ec"></path></svg>
</section>

<section aria-label="{{t.infoAria}}" style="max-width: 1240px; margin: 0 auto; padding: 24px clamp(20px, 4vw, 40px) 8px">
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); border-top: 1px solid #e0d1b8; border-bottom: 1px solid #e0d1b8; text-align: center">
<sc-for list="{{allLocs}}" as="l" hint-placeholder-count="2">
<div class="infocell" style="padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #1f6a40">{{l.upper}}</span>
<span style="font-size: 16px; line-height: 24px">{{l.addr1}}<br>{{l.addr2}}</span>
<a href="{{l.maps}}" style="font-size: 13px; font-weight: 700; letter-spacing: 0.12em; text-transform: uppercase; min-height: 32px; display: flex; align-items: center">{{t.directions}}</a>
</div>
</sc-for>
<div class="infocell" style="padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #1f6a40">{{t.callLabel}}</span>
<sc-for list="{{allLocs}}" as="l" hint-placeholder-count="2">
<span style="font-size: 15px; line-height: 22px; display: flex; flex-direction: column"><span style="color: #6b5446">{{l.name}}</span><a href="{{l.tel}}" style="color: #2b1d17; font-weight: 600; white-space: nowrap; font-size: 16px">{{l.phone}}</a></span>
</sc-for>
</div>
<div class="infocell" style="padding: 24px 16px; display: flex; flex-direction: column; align-items: center; gap: 6px">
<span style="font-size: 12px; font-weight: 700; letter-spacing: 0.18em; color: #1f6a40">{{t.lunchLabel}}</span>
<span style="font-size: 16px; line-height: 24px">{{t.lunchDays}}<br>{{t.lunchTime}}</span>
<span style="font-size: 14px; font-weight: 700; color: #c3313d">{{t.lunchFrom}}</span>
</div>
</div>
</section>

<section id="specials" aria-labelledby="picks-title" style="scroll-margin-top: 90px; max-width: 1240px; margin: 0 auto; padding: clamp(56px, 8vw, 96px) clamp(20px, 4vw, 40px) 0; display: flex; flex-direction: column; align-items: center; gap: 36px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<h2 id="picks-title" style="margin: 0; font-family: 'Bitter', Georgia, serif; font-weight: 800; font-size: clamp(36px, 4.5vw, 52px); line-height: 1.1">{{t.picksTitle}}</h2>
<span aria-hidden="true" style="width: 72px; height: 3px; border-radius: 2px; background: #c3313d"></span>
<p style="margin: 0; color: #6b5446">{{t.picksSub}}</p>
</div>
<div style="width: 100%; display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px">
<sc-for list="{{picks}}" as="p" hint-placeholder-count="4">
<a class="pick" href="#menu" onClick="{{p.pick}}" style="display: flex; flex-direction: column; border-radius: 10px; overflow: hidden; background: #ffffff; border: 1px solid #ece0cb; text-decoration: none; color: #2b1d17; box-shadow: 0 2px 10px rgba(43, 29, 23, 0.06)">
<div style="height: 190px; background: #f4ead8; display: flex; align-items: center; justify-content: center; padding: 14px; box-sizing: border-box; overflow: hidden">
<img src="{{p.img}}" alt="" style="max-width: 100%; max-height: 100%; object-fit: contain">
</div>
<div style="padding: 18px 20px 20px; display: flex; flex-direction: column; gap: 4px">
<span style="font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 21px; line-height: 1.2">{{p.name}}</span>
<span style="font-size: 15px; color: #6b5446">{{p.desc}}</span>
<span style="display: flex; justify-content: space-between; align-items: center; margin-top: 8px"><span style="font-family: 'Bitter', Georgia, serif; font-weight: 700; color: #c3313d">{{p.price}}</span><span style="font-size: 13px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; color: #1f6a40">{{t.seeOnMenu}} →</span></span>
</div>
</a>
</sc-for>
</div>
</section>



<section id="menu" aria-labelledby="menu-title" style="scroll-margin-top: 90px; background: #ffffff; border-top: 1px solid #ece0cb">
<div style="max-width: 1240px; margin: 0 auto; padding: clamp(56px, 8vw, 96px) clamp(20px, 4vw, 40px); display: flex; flex-direction: column; gap: 32px">
<div style="display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center">
<h2 id="menu-title" style="margin: 0; font-family: 'Bitter', Georgia, serif; font-weight: 800; font-size: clamp(36px, 4.5vw, 52px); line-height: 1.1">{{t.menuTitle}}</h2>
<span aria-hidden="true" style="width: 72px; height: 3px; border-radius: 2px; background: #c3313d"></span>
<p style="margin: 0; color: #6b5446">{{t.menuSub}}</p>
<div style="display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 12px 20px; padding-top: 8px">
<div style="position: relative; width: min(100%, 380px)">
<label for="menu-search" style="position: absolute; left: -9999px">{{t.searchLabel}}</label>
<svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#6b5446" stroke-width="2" stroke-linecap="round" style="position: absolute; left: 14px; top: 15px"><circle cx="11" cy="11" r="7"></circle><path d="M20 20l-4-4"></path></svg>
<input id="menu-search" type="search" value="{{q}}" onChange="{{onSearch}}" placeholder="{{t.searchPh}}" autocomplete="off" style="width: 100%; min-height: 48px; padding: 0 14px 0 42px; border-radius: 4px; border: 1px solid #8f7a60; font: 400 16px 'Instrument Sans', sans-serif; color: #2b1d17; background: #ffffff; box-sizing: border-box">
</div>
<a href="/assets/los-jalapenos-menu.pdf" style="font-weight: 600; font-size: 15px; min-height: 44px; display: flex; align-items: center">{{t.pdf}}</a>
</div>
</div>

<div style="display: flex; flex-wrap: wrap; gap: 32px 56px; align-items: flex-start">
<div class="side" role="group" aria-label="{{t.catAria}}" style="flex: 1 1 220px; max-width: 100%; display: flex; flex-direction: column; flex-wrap: wrap; gap: 2px; padding-bottom: 4px">
<sc-for list="{{cats}}" as="cat" hint-placeholder-count="10">
<sc-if value="{{cat.active}}" hint-placeholder-val="{{false}}">
<button type="button" aria-pressed="true" onClick="{{cat.pick}}" style="text-align: left; min-height: 44px; padding: 0 14px; border-radius: 4px; border: none; background: #c3313d; color: #ffffff; font: 600 16px 'Instrument Sans', sans-serif; cursor: pointer">{{cat.label}}</button>
</sc-if>
<sc-if value="{{cat.inactive}}" hint-placeholder-val="{{true}}">
<button class="catbtn" type="button" aria-pressed="false" onClick="{{cat.pick}}" style="text-align: left; min-height: 44px; padding: 0 14px; border-radius: 4px; border: none; background: transparent; color: #2b1d17; font: 500 16px 'Instrument Sans', sans-serif; cursor: pointer">{{cat.label}}</button>
</sc-if>
</sc-for>
</div>

<div style="flex: 999 1 560px; min-width: 0; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 8px 16px; padding-bottom: 12px; border-bottom: 2px solid #2b1d17">
<h3 aria-live="polite" style="margin: 0; font-family: 'Bitter', Georgia, serif; font-weight: 800; font-size: clamp(26px, 3vw, 34px); line-height: 1.15; color: #1f6a40">{{view.title}}</h3>
<sc-if value="{{view.searching}}" hint-placeholder-val="{{false}}">
<button type="button" onClick="{{clearSearch}}" style="min-height: 44px; padding: 0 8px; border: none; background: transparent; color: #c3313d; font: 600 15px 'Instrument Sans', sans-serif; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">{{t.clear}}</button>
</sc-if>
</div>
<sc-if value="{{view.hasNote}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; font-family: 'Bitter', Georgia, serif; font-style: italic; color: #4d3b30; font-size: 16px; line-height: 25px">{{view.note}}</p>
</sc-if>
<sc-if value="{{view.empty}}" hint-placeholder-val="{{false}}">
<p style="margin: 0; color: #6b5446">{{t.noResults}}</p>
</sc-if>
<div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 0 48px">
<sc-for list="{{view.items}}" as="item" hint-placeholder-count="6">
<article style="display: flex; flex-direction: column; gap: 4px; padding: 16px 0; border-bottom: 1px solid #ece0cb">
<div style="display: flex; align-items: baseline; justify-content: space-between; gap: 16px">
<h4 style="margin: 0; font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 19px; line-height: 26px; color: #2b1d17">{{item.name}}</h4>
<sc-if value="{{item.hasPrice}}" hint-placeholder-val="{{true}}">
<span style="font-family: 'Bitter', Georgia, serif; font-weight: 700; font-size: 18px; line-height: 26px; color: #c3313d; white-space: nowrap">{{item.price}}</span>
</sc-if>
</div>
<sc-if value="{{item.showCat}}" hint-placeholder-val="{{false}}">
<span style="font-size: 12px; line-height: 18px; font-weight: 700; letter-spacing: 0.1em; color: #1f6a40">{{item.cat}}</span>
</sc-if>
<sc-if value="{{item.hasDesc}}" hint-placeholder-val="{{true}}">
<p style="margin: 0; color: #6b5446; font-size: 15px; line-height: 24px">{{item.desc}}</p>
</sc-if>
<sc-if value="{{item.hasOpts}}" hint-placeholder-val="{{false}}">
<ul style="list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 2px">
<sc-for list="{{item.opts}}" as="o" hint-placeholder-count="3">
<li style="display: flex; justify-content: space-between; gap: 16px; font-size: 15px; line-height: 24px">
<span>{{o.label}}</span>
<span style="font-family: 'Bitter', Georgia, serif; font-weight: 700; color: #c3313d; white-space: nowrap">{{o.price}}</span>
</li>
</sc-for>
</ul>
</sc-if>
<sc-if value="{{item.veg}}" hint-placeholder-val="{{false}}">
<span style="align-self: flex-start; margin-top: 4px; font-size: 12px; line-height: 16px; font-weight: 700; letter-spacing: 0.06em; color: #1f6a40; background: #e3efe6; padding: 4px 10px; border-radius: 999px">{{t.vegTag}}</span>
</sc-if>
</article>
</sc-for>
</div>
<div style="display: flex; flex-direction: column; gap: 6px; font-size: 14px; line-height: 20px; color: #6b5446; padding-top: 16px">
<p style="margin: 0">{{t.sauteed}}</p>
<p style="margin: 0">{{t.raw}}</p>
<sc-if value="{{t.showEnNote}}" hint-placeholder-val="{{false}}">
<p style="margin: 0">{{t.enNote}}</p>
</sc-if>
</div>
</div>
</div>
</div>
</section>

<section aria-labelledby="about-title" style="max-width: 1240px; margin: 0 auto; padding: clamp(64px, 9vw, 112px) clamp(20px, 4vw, 40px); display: flex; flex-wrap: wrap; align-items: center; gap: clamp(32px, 5vw, 72px)">
<div style="flex: 1 1 400px; display: flex; flex-direction: column; gap: 16px">
<span style="display: flex; align-items: center; gap: 10px; font-size: 13px; font-weight: 700; letter-spacing: 0.16em; color: #c3313d">{{t.aboutKicker}}<svg aria-hidden="true" width="44" height="10" viewBox="0 0 44 10"><path d="M1 8 L6 2 L11 8 L16 2 L21 8 L26 2 L31 8 L36 2 L41 8" fill="none" stroke="#c3313d" stroke-width="1.8" stroke-linejoin="round"></path></svg></span>
<h2 id="about-title" style="margin: 0; font-family: 'Bitter', Georgia, serif; font-weight: 800; font-size: clamp(32px, 4vw, 46px); line-height: 1.12; color: #7f2f2c; max-width: 18ch">{{t.aboutTitle}}</h2>
<p style="margin: 0; color: #4d3b30; max-width: 46ch">{{t.aboutBody}}</p>
<a class="btn-red" href="#menu" style="align-self: flex-start; margin-top: 8px; min-height: 52px; padding: 0 26px; border-radius: 4px; background: #c3313d; color: #ffffff; text-decoration: none; font-weight: 700; font-size: 15px; letter-spacing: 0.08em; text-transform: uppercase; display: flex; align-items: center">{{t.viewMenu}}</a>
